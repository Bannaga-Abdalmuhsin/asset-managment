<!doctype html>
<html lang="en" class="auth-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="stc COW asset management map for Saudi Arabia" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://maps.gstatic.com https://maps.googleapis.com https://*.google.com https://*.ggpht.com; connect-src 'self' https://*.supabase.co https://maps.googleapis.com https://maps.gstatic.com https://raw.githubusercontent.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests" />
  <title>stc COW Asset Management</title>
  <link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Asset Management home">
        <span class="brand-mark"><img src="stc-logo.svg" alt="stc" /></span>
        <span><strong>COW Asset Management</strong></span>
      </a>

      <div class="search-wrap" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
        <input id="site-search" type="search" placeholder="Search site ID — e.g. COW001" autocomplete="off" aria-label="Search COW site" />
        <kbd>/</kbd>
        <div id="suggestions" class="suggestions" hidden></div>
      </div>

      <div class="account-state">
        <button id="account-trigger" class="avatar-button" type="button" aria-label="Open user menu" aria-haspopup="true" aria-expanded="false"><img class="user-avatar" alt="" hidden /><span class="user-initials">U</span></button>
        <section id="account-menu" class="user-menu" aria-label="User menu" hidden>
          <div class="user-menu-head"><strong id="current-user">Loading…</strong><small id="account-email">—</small></div>
          <a href="account.html">Settings</a>
          <button type="button" data-logout>Logout</button>
        </section>
      </div>
    </header>

    <section class="map-stage" aria-label="Saudi Arabia COW sites map">
      <div class="map-frame">
        <div id="map" aria-live="polite"></div>
        <div id="loading" class="loading-card"><span class="spinner"></span>Loading live assets…</div>
        <div class="status-filter" aria-label="Filter sites by status">
          <button class="active" data-status-filter="all">All</button>
          <button data-status-filter="on-air"><i class="dot online"></i>ON-AIR</button>
          <button data-status-filter="off-air"><i class="dot offline"></i>OFF-AIR</button>
        </div>

      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script src="config.js?v=4"></script>
  <script src="auth.js?v=4"></script>
  <script src="app.js?v=18"></script>
</body>
</html>
