<!doctype html>
<html lang="en" class="auth-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="COW asset record" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests" />
  <title>Asset Record · stc COW Asset Management</title>
  <link rel="stylesheet" href="styles.css?v=11" />
  <link rel="stylesheet" href="site.css?v=5" />
</head>
<body class="record-body">
  <header class="topbar record-topbar">
    <a class="brand" href="index.html"><span class="brand-mark"><img src="stc-logo.svg" alt="stc" /></span><span><strong>COW Asset Management</strong></span></a>
    <a class="back-link" href="index.html">← National map</a>
    <div class="record-actions">
      <div class="live-state account-state">
        <span class="account-dot"></span>
        <button id="account-trigger" class="account-trigger" type="button" aria-haspopup="true" aria-expanded="false">
          <small>Logged in as</small><b id="current-user">Loading…</b><i>⌄</i>
        </button>
        <section id="account-menu" class="account-menu" aria-label="User account" hidden>
          <header><strong>Account</strong><button id="account-close" type="button" aria-label="Close account menu">×</button></header>
          <dl><div><dt>Email</dt><dd id="account-email">—</dd></div><div><dt>Last sign-in</dt><dd id="account-last-sign-in">—</dd></div></dl>
          <form id="username-form">
            <label>Username<input name="username" type="text" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" autocomplete="username" required /></label>
            <button type="submit">Change username</button>
          </form>
          <form id="password-form">
            <label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required /></label>
            <button type="submit">Change password</button>
          </form>
          <p id="account-message" class="account-message" hidden></p>
          <button class="account-logout" type="button" onclick="assetLogout()">Logout</button>
        </section>
      </div>
    </div>
  </header>
  <main class="record-shell">
    <div id="record-loading" class="record-state"><span class="spinner"></span>Loading authorized asset record…</div>
    <div id="record-error" class="record-state error" hidden></div>
    <article id="record" hidden>
      <header class="record-hero">
        <div><p id="record-region" class="site-kicker"></p><div class="site-title-row"><h1 id="record-id"></h1><span id="record-status" class="status-pill"></span></div><p id="record-location" class="site-location"></p></div>
        <a id="coordinate-link" class="map-link" target="_blank" rel="noopener noreferrer">Open coordinates ↗</a>
      </header>
      <nav id="category-nav" class="category-nav" aria-label="Asset system categories"></nav>
      <div id="categories" class="category-list"></div>
    </article>
  </main>
  <script src="config.js?v=4"></script>
  <script src="auth.js?v=3"></script>
  <script src="site.js?v=8"></script>
</body>
</html>
