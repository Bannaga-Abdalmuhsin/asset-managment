<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="COW asset record" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests" />
  <title>Asset Record · ACES Asset Management</title>
  <link rel="stylesheet" href="styles.css?v=5" />
  <link rel="stylesheet" href="site.css?v=1" />
</head>
<body class="record-body">
  <header class="topbar record-topbar">
    <a class="brand" href="index.html"><span class="brand-mark">A</span><span><strong>Asset Management</strong><small>Kingdom COW Network</small></span></a>
    <a class="back-link" href="index.html">← National map</a>
    <div class="classification">INTERNAL · RESTRICTED</div>
  </header>
  <main class="record-shell">
    <div id="record-loading" class="record-state"><span class="spinner"></span>Loading authorized asset record…</div>
    <div id="record-error" class="record-state error" hidden></div>
    <article id="record" hidden>
      <header class="record-hero">
        <div><p id="record-region" class="site-kicker"></p><div class="site-title-row"><h1 id="record-id"></h1><span id="record-status" class="status-pill"></span></div><p id="record-location" class="site-location"></p></div>
        <a id="coordinate-link" class="map-link" target="_blank" rel="noopener noreferrer">Open coordinates ↗</a>
      </header>
      <nav id="category-nav" class="category-nav" aria-label="Asset system categories"></nav>
      <div id="categories" class="category-list"></div>
    </article>
  </main>
  <script src="site.js?v=1"></script>
</body>
</html>
