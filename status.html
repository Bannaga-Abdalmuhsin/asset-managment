<!doctype html>
<html lang="en" class="auth-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="cow-favicon.svg" />
  <meta name="description" content="Authorized CAPEX and OPEX status for the national STC COW asset catalogue." />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#4f008c" />
  <meta name="color-scheme" content="light dark" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'" />
  <title>Status · stc COW Asset Management</title>
  <link rel="stylesheet" href="styles.css?v=21" />
  <link rel="stylesheet" href="dashboard.css?v=6" />
  <link rel="stylesheet" href="em.css?v=2" />
</head>
<body class="dashboard-body" data-dashboard-page="status">
  <header class="topbar dashboard-topbar">
    <a class="brand" href="index.html"><span class="brand-mark"><img src="stc-logo.svg" alt="stc" /></span><span><strong>COW Asset Management</strong></span></a>
    <a class="dashboard-back" href="index.html">← National map</a>
    <div class="account-state">
      <button id="account-trigger" class="avatar-button" type="button" aria-label="Open user menu" aria-haspopup="true" aria-expanded="false"><img class="user-avatar" alt="" hidden /><span class="user-initials">U</span></button>
      <section id="account-menu" class="user-menu" aria-label="User menu" hidden>
        <div class="user-menu-head"><strong id="current-user">Loading…</strong><small id="account-email">—</small></div>
        <a href="account.html">Settings</a><button type="button" data-logout>Logout</button>
      </section>
    </div>
  </header>
  <div class="dashboard-layout">
    <nav class="asset-menu dashboard-menu" aria-label="National Asset Status">
      <a class="menu-title" href="index.html">National Asset Status</a>
      <span class="menu-caption">WORKSPACE</span>
      <a href="asset-details.html">Asset details</a>
      <a href="cow-risk.html">COWs Risk Flags</a>
      <span class="menu-caption">OPERATIONS</span>
      <a href="status.html?view=capex" data-view="capex">CAPEX status</a>
      <a href="status.html?view=opex" data-view="opex">OPEX status</a>
      <a class="menu-settings" href="account.html">Settings</a>
    </nav>
    <main class="dashboard-content">
      <div class="dashboard-heading"><p>NATIONAL ASSET STATUS</p><h1 id="view-title">Status</h1></div>
<p id="em-state" hidden>Loading CAPEX/OPEX requests…</p>
      <section id="em-summary" class="em-summary" hidden aria-label="CAPEX and OPEX requests">
        <div class="em-metrics">
          <div class="em-metric focus"><small>Not completed</small><strong id="em-not-completed">—</strong></div>
          <div class="em-metric done"><small>Completed</small><strong id="em-completed">—</strong></div>
          <div class="em-metric"><small>In approval / returned</small><strong id="em-pending">—</strong></div>
          <div class="em-metric"><small>Rejected / cancelled</small><strong id="em-closed">—</strong></div>
        </div>
        <div class="em-filters" aria-label="Completion filter">
          <button type="button" data-em-filter="not-completed" class="active">Not completed</button>
          <button type="button" data-em-filter="completed">Completed</button>
          <button type="button" data-em-filter="all">All requests</button>
        </div>
        <div id="em-categories" class="em-categories" aria-label="Equipment categories"></div>
        <input id="em-search" class="em-search" type="search" placeholder="Search site ID or name" aria-label="Search CAPEX/OPEX sites" />
        <p id="em-match" class="em-intro"></p>
        <div class="em-table-wrap"><table class="em-table"><thead><tr><th scope="col"><button class="table-sort" type="button" data-sort="site">Site</button></th><th scope="col"><button class="table-sort" type="button" data-sort="category">Category</button></th><th scope="col"><button class="table-sort" type="button" data-sort="status">Request status</button></th><th scope="col"><button class="table-sort" type="button" data-sort="request">Request ID</button></th><th scope="col" aria-sort="descending"><button class="table-sort" type="button" data-sort="updated">Updated</button></th></tr></thead><tbody id="em-rows"></tbody></table></div>
        <button id="em-more" class="em-more" type="button" hidden>Show more</button>
      </section>
    </main>
  </div>
  <script src="config.js?v=4"></script><script src="auth.js?v=9"></script><script src="dashboard.js?v=3"></script><script type="module" src="em-view.mjs?v=6"></script>
</body>
</html>
