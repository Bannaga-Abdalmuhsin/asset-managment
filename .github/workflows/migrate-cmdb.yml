name: Migrate CMDB to Supabase

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-cmdb.yml
      - scripts/migrate-cmdb.mjs
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmdb-supabase-sync
  cancel-in-progress: false

jobs:
  migrate:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import current Google Sheet
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CMDB_CSV_URL: ${{ secrets.CMDB_CSV_URL }}
        run: node scripts/migrate-cmdb.mjs
