name: Sync fuel plans to Supabase
on:
  push:
    branches: [main]
    paths:
      - fuel-plan.mjs
      - scripts/sync-fuel.mjs
      - .github/workflows/sync-fuel.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuel-plan-sync
  cancel-in-progress: false
jobs:
  sync:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync valid fuel dates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FUEL_CSV_URL: ${{ secrets.FUEL_CSV_URL }}
        run: node scripts/sync-fuel.mjs
